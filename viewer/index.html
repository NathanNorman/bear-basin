<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bear Basin viewer</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <main id="viewport" aria-label="Interactive Bear Basin model"></main>
  <section id="disassembly" aria-label="Disassembly animation">
    <div class="disassembly-title"><span>FIELD / ASSEMBLY</span><output id="explode-value" for="explode">ASSEMBLED · 0%</output></div>
    <label for="explode">Drag to disassemble / reassemble</label>
    <div class="release-hint">At full separation, gravity takes over.</div>
    <input id="explode" type="range" min="0" max="1000" value="0" disabled>
    <div class="disassembly-actions"><button id="assemble" type="button" disabled>Reassemble</button><button id="disassemble" type="button" disabled>Disassemble</button><button id="inspect" type="button">Hide inspector</button></div>
  </section>
  <aside id="panel" aria-label="Model controls and notes">
    <div id="help">Drag: rotate · Right-drag or Shift-drag: pan · Scroll: zoom · Click a part to select it</div>
    <div id="model-status" role="status" aria-live="polite">Loading model…</div>
    <button id="retry" type="button" hidden>Retry loading</button>
    <h3>Selected</h3>
    <div id="sel" aria-live="polite">nothing</div>
    <label class="visually-hidden" for="note">Note about the selected part</label>
    <textarea id="note" placeholder="What's wrong with this part?"></textarea>
    <button id="add" type="button">Add note</button><button id="copy" type="button" disabled>Copy all notes</button>
    <div id="notes-status" role="status" aria-live="polite"></div>
    <div id="copy-fallback" hidden>
      <label for="notes-export">Select and copy these notes:</label>
      <textarea id="notes-export" readonly></textarea>
    </div>
    <div id="notes"></div>
    <h3>Show</h3>
    <div id="groups"></div>
    <button id="reset" type="button">Reset view</button>
    <button id="bracket-view" type="button">Y-bracket close-up</button>
  </aside>
  <noscript>This viewer requires JavaScript.</noscript>
  <script type="importmap">{
    "imports": {
      "three": "./vendor/three.mjs",
      "three/addons/": "./vendor/addons/"
    }
  }</script>
  <script type="module" src="app.js"></script>
</body>
</html>
